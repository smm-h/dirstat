# Version bump type: patch, minor, major, hotfix, or prerelease
bump = "minor"
# Short description of this release (required)
description = "Scan config files via --config, and curated default excludes (including .git) for fast out-of-the-box scans."
# Optional context explaining why these changes were made
context = """
Real-world use showed that scanning large project trees requires the same
~20 --exclude flags every time (node_modules, .git, caches, build output),
so dirstat now ships a curated default exclude list and an explicit TOML
config mechanism. The config file is never auto-discovered: it is used only
when --config <path> is passed, and setting a key both in the file and on
the command line is a hard error rather than a silent override. Existing
behavior (scan everything) is restored with exclude = [] or any explicit
--exclude value.
"""

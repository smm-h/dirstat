# strictspec document version gate (do not remove)
format_version = 1
# Version bump type: patch, minor, major, infra, or prerelease
#   prerelease: advance an existing pre-release (0.6.0-beta.0 -> -beta.1)
bump = "minor"
# Short description of this release (required)
description = "New --formats canonical mode: merges alias formats (mjs/js, h/c, hpp/cpp) and names extensionless scripts by their shebang interpreter."
# Optional context explaining why these changes were made
context = """
Downstream aggregation over many projects wants per-language totals, not
per-spelling totals: mjs and js are one language, h belongs with c, and an
extensionless script with `#!/usr/bin/env -S uv run python` is Python, not
text/plain. The default stays raw, so existing JSON consumers see
byte-identical output; canonical is opt-in via --formats or the config key.
"""
# Pre-release channel: alpha, beta, rc, or stable (ordered;
# demotion is an error). With patch/minor/major it ENTERS the
# channel (0.5.2 + minor + alpha -> 0.6.0-alpha.0); with
# bump = "prerelease" it promotes, and "stable" strips the
# suffix. See docs/release-workflow.md#the-pre-release-channel.
# preid = ""
# Set to true to generate a blog post for this release
# blog = false
include = ["go"]
exclude = []
candidate_sha = "e25d37076a6b63a36f9d99a70c1aa7aff803225e"

